#cloud-config
users:
  - name: ardupilot
    groups: [dialout]
    shell: /bin/bash
    lock_passwd: true
    sudo: []
ssh_pwauth: false
disable_root: true
package_update: true
packages:
  - build-essential
  - git
  - ca-certificates
  - python3-dev
  - python3-empy
  - python3-future
  - python3-pexpect
  - python3-numpy
  - python3-lxml
  - python3-pyparsing
  - python3-psutil
  - python3-pkg-resources
  - pkg-config
  - gawk
  - ccache
write_files:
  - path: /etc/ardupilot/nmea.parm
    permissions: '0644'
    content: |
      FRAME_CLASS 1
      FRAME_TYPE 0
      SERIAL3_PROTOCOL 5
      SERIAL3_BAUD 9
      GPS_TYPE 5
      GPS_TYPE2 0
      GPS_AUTO_CONFIG 0
      GPS_AUTO_SWITCH 0
      SIM_GPS_TYPE 0
      SIM_GPS2_TYPE 0
  - path: /etc/systemd/system/ardupilot.service
    permissions: '0644'
    content: |
      [Unit]
      Description=ArduCopter SITL with external NMEA GPS
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=ardupilot
      SupplementaryGroups=dialout
      WorkingDirectory=/home/ardupilot
      ExecStart=/home/ardupilot/ardupilot/build/sitl/bin/arducopter --model quad --home 48.1173,11.516667,545.4,0 --defaults /etc/ardupilot/nmea.parm --serial0 tcp:0 --serial3 uart:/dev/ttyS1:9600
      Restart=on-failure
      RestartSec=5
      StandardOutput=journal+console
      StandardError=journal+console
      NoNewPrivileges=true

      [Install]
      WantedBy=multi-user.target
runcmd:
  - |
    set -eu
    sudo -H -u ardupilot git clone --branch Copter-4.5.7 --depth 1 --recurse-submodules --shallow-submodules https://github.com/ArduPilot/ardupilot.git /home/ardupilot/ardupilot
    cd /home/ardupilot/ardupilot
    sudo -H -u ardupilot ./waf configure --board sitl
    sudo -H -u ardupilot ./waf copter -j2
    systemctl mask serial-getty@ttyS1.service
    systemctl daemon-reload
    systemctl enable --now ardupilot.service
